# Managed by chezmoi (run_onchange_after_setup-ipu7-camera.sh)
# Virtual camera fed by ipu7-camera-relay.service; exclusive_caps so
# Chromium/Electron see a capture-only device.
options v4l2loopback devices=1 video_nr=50 card_label="Integrated Camera" exclusive_caps=1

# TEMPORARY: speaker workaround, paired with the intel_cvs rule in
# /etc/udev/rules.d/72-ipu7-camera.rules. Remove both together; the blacklist
# alone would leave the camera driver unloaded.
#
# On the XPS 16 DA16260, intel_cvs (the camera's vision-sensing chip, which
# Arch enabled in linux 7.2.7) claims its wake GPIO, which is the same pin the
# four CS35L57 speaker amps read as spk-id-gpios. Whichever driver probes first
# wins: if intel_cvs does, every amp fails with "-EBUSY: Failed to get
# spk-id-gpios", never retries, and no sound card appears (only Dummy Output).
# If the amps go first, they read the pin and release it, and both work.
# "blacklist" only stops the boot-time autoload; the udev rule then loads
# intel_cvs by name once the sound card exists, which forces the working order.
#
# Roll back once the running kernel has upstream ed447e2b1da9 "media: i2c: cvs:
# Get the wake IRQ without claiming the GPIO", first in stable 7.3.4 (and not
# in any 7.2.y). Check with `pacman -Q linux` against Arch's changelog for that
# commit, then delete this block and the udev rule, chezmoi apply, and reboot a
# few times: `aplay -l` should list sof-soundwire on every boot.
# Background: thesofproject/linux#5940, Red Hat bug 2529031.
blacklist intel_cvs
