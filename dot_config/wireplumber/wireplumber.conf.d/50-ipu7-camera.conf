# Intel IPU7 MIPI camera (OV08X40 sensor): hide the raw paths from PipeWire.
# Apps get the camera through the "Integrated Camera" v4l2loopback device fed
# by ipu7-camera-relay.service instead.

# The 32 ISYS capture nodes deliver raw Bayer, which no app can use directly.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.card = "ipu7" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# libcamera 0.7.2 aborts in the software ISP stats when this sensor runs in its
# binned 1928x1088 mode, and the libcamera SPA runs inside the PipeWire daemon.
# The relay pins the full sensor mode; keep PipeWire from opening it directly.
monitor.libcamera.rules = [
  {
    matches = [
      { device.product.name = "ov08x40" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
