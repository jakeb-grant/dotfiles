# Hypridle Configuration
#
# Auto-suspend intentionally removed — see README.md in this directory
# for the xe driver crash that motivated this. Restore the suspend
# listener once the kernel bug is fixed and re-tested per the procedure
# in README.md.

general {
    lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")'
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")' && loginctl lock-session
}

# Lock screen after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn off displays after 30 minutes (cheap, instant wake)
# Kept longer than the 10-min lock so the lockscreen is actually visible
# for a while before the screens sleep.
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
