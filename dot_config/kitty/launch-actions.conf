# What `kitty +open` does with what it's handed. kitty-open.desktop is the
# system's folder handler (xdg-mime, mimeapps.list is left to the apps), so
# "Show in folder" and opening a directory land here: Yazi, as Super+Shift+F.
protocol file
mime inode/directory
action launch --type=os-window --cwd -- yazi ${FILE_PATH}
